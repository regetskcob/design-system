{{- /* Bus activity of the last 60 s as bars (KNX Monitor). */ -}}
{{- $h := slice 14 16 17 19 18 20 21 19 18 21 20 22 20 19 17 20 21 18 13 9 7 7 5 7 5 4 6 4 4 5 -}}
<svg viewBox="0 0 120 24" preserveAspectRatio="none" aria-hidden="true">{{ range $i, $v := $h }}<rect x="{{ mul $i 4 }}" y="{{ sub 24 $v }}" width="2.4" height="{{ $v }}"/>{{ end }}</svg>
